[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metvane"
dynamic = ["version"]
description = "A unified evaluation framework for weather forecasting and nowcasting"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "MetVane Contributors"},
]
keywords = ["weather", "forecasting", "nowcasting", "evaluation", "metrics", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.22",
]

[project.optional-dependencies]
torch = ["torch>=1.12"]
xarray = ["xarray>=2022.3", "pandas"]
examples = ["xarray>=2022.3", "netCDF4"]
all = ["torch>=1.12", "xarray>=2022.3", "pandas"]
dev = ["pytest>=7.0", "torch>=1.12", "xarray>=2022.3", "pandas", "dask", "scipy"]

[project.urls]
Homepage = "https://github.com/MetAILab/metvane"
Repository = "https://github.com/MetAILab/metvane"

[tool.setuptools.dynamic]
version = {attr = "metvane.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metvane = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA device (run on a GPU node, see scripts/run_gpu_tests.sh)",
]
