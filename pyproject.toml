[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metvane"
version = "0.1.0"
description = "A unified evaluation framework for weather forecasting and nowcasting"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "MetVane Contributors"},
]
keywords = ["weather", "forecasting", "nowcasting", "evaluation", "metrics", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.22",
]

[project.optional-dependencies]
torch = ["torch>=1.12"]
xarray = ["xarray>=2022.3", "netCDF4"]
all = ["torch>=1.12", "xarray>=2022.3", "netCDF4", "scipy"]
dev = ["pytest>=7.0", "torch>=1.12", "xarray>=2022.3", "scipy"]

[project.urls]
Homepage = "https://github.com/your-org/metvane"
Documentation = "https://metvane.readthedocs.io"
Repository = "https://github.com/your-org/metvane"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
